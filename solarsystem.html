<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Solar System</title>

<link rel="stylesheet" href="solar.css">

</head>
<body>

<div class="space">

    <div class="sun">☀</div>

    <div class="orbit mercury">
        <div class="planet">
            ☿
            <span>Mercury</span>
        </div>
    </div>

    <div class="orbit venus">
        <div class="planet">
            ♀
            <span>Venus</span>
        </div>
    </div>

    <div class="orbit earth">
        <div class="planet">
            🌍
            <span>Earth</span>
        </div>
    </div>

    <div class="orbit mars">
        <div class="planet">
            ♂
            <span>Mars</span>
        </div>
    </div>

</div>

</body>
</html>
