<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Grid Layout</title>

<style>


.container{
    display:grid;
    grid-template-columns: 200px 1fr 1fr 1fr;
    grid-template-rows: 150px 150px 350px 150px;
    gap:5px;
    background-color:#171432;
    padding:10px;
    border-radius:10px;
}

.box{
    border:2px solid #222;
    border-radius:10px;
}
.sidebar, .header, .card1, .card2, .card3, .main, .right-panel, .footer1, .footer2, .footer3{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.5em;
    color:#fff;
}

.sidebar{
    grid-row:1 / 5;
    background:#2f5ee5;
}

.header{
    grid-column:2 / 5;
    background:#71d3c4;
}

.card1{
    background:#5db3df;
}

.card2{
    background:#69c464;
}

.card3{
    background:#f39500;
}

.main{
    grid-column:2 / 4;
    background:#7c2df5;
}

.right-panel{
    background:#e14f9f;
}

.footer1{
    background:#5db3df;
}

.footer2{
    background:#5db3df;
    justify-self:center;
    width: 100%;
}

.footer3{
    background:#5db3df;
}
</style>
</head>

<body>

<div class="container">

    <div class="box sidebar">Sidebar</div>

    <div class="box header">Top Navigation</div>

    <div class="box card1">Users<br>12,450</div>
    <div class="box card2">Revenue<br>$24,800</div>
    <div class="box card3">Orders<br>1,234</div>

    <div class="box main">Charts<br>(span 2)</div>
    <div class="box right-panel">Table</div>

    <div class="box footer1">Widget1</div>
    <div class="box footer2">Widget2</div>
    <div class="box footer3">Widget3</div>

</div>

</body>
</html>
