<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Grid Layout</title>

<style>
*{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
body{
    display:grid;
    place-items:center;
    background:#090816;
    padding:24px;
    color:#fff;
}
.dashboard{
    width:100%;
    max-width:1400px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:240px 240px 240px;
    gap:18px;
}
.card{
    border-radius:28px;
    padding:24px;
    position:relative;
    box-shadow:0 14px 35px rgba(0,0,0,.28);
}
.apps{
    grid-column:1/2;
    grid-row:1/2;
    background:#2a214d;
}
.likes{
    grid-column:2/3;
    grid-row:1/2;
    background:#2b224f;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.viewers{
    grid-column:3/4;
    grid-row:1/2;
    background:#2b224f;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.users{
    grid-column:1/2;
    grid-row:2/3;
    background:#2a214d;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
.design{
    grid-column:2/3;
    grid-row:2/3;
    background:#2340c8;
    display:grid;
    place-items:center;
}
.subscribers{
    grid-column:3/4;
    grid-row:2/4;
    background:#dfe9f5;
    color:#0d1020;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}
.learn{
    grid-column:1/3;
    grid-row:3/4;
    background:#1e1840;
    display:flex;
    align-items:flex-start;
}
.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    font-size:18px;
    font-weight:700;
}
.small-pill{
    font-size:13px;
    font-weight:700;
    padding:8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.12);
}
.live-pill{
    background:#ea1e27;
    display:flex;
    align-items:center;
    gap:8px;
}
.live-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#fff;
}
.social-row{
    margin-top:50px;
    display:flex;
    gap:10px;
    position:absolute;

}
.social-box{
    width:72px;
    height:72px;
    background:#2f56ff;
    border-radius:10px;
    display:grid;
    place-items:center;
    color:white;
}
.big-number{
    font-size:90px;
    font-weight:800;
    line-height:1;
}
.subtitle{
    margin-top:15px;
    font-size:18px;
    color:rgba(255,255,255,.8);
}
.metric-top{
    display:flex;
    justify-content:space-between;
    font-weight:700;
}
.metric-change{
    color:#72d7d1;
}
.metric-change.alt{
    color:#6bd3a6;
}
.users .big-number{
    display:flex;
    justify-content:center;
    align-items:center;
    flex:1;
}
.design h2{
    font-size:72px;
    font-family:"Times New Roman",serif;
    letter-spacing:2px;
}
.learn h3{
    font-size:38px;
    font-weight:600;
    line-height:1.2;
    padding:10px;
    max-width:500px;
}
</style>
</head>
<body>
<div class="dashboard">
    <section class="card apps">

            <span class="small-pill">Launch Apps →</span>

        </div>
    </section>
    <section class="card likes">
        <div class="big-number">25K</div>
        <div class="subtitle">Weekly Likes</div>
    </section>
    <section class="card viewers">
        <div class="small-pill live-pill" style="position:absolute;top:20px;right:20px;">
            <span class="live-dot"></span>
            LIVE
        </div>
        <div class="big-number">50K</div>
        <div class="subtitle">Weekly Viewers</div>
    </section>
    <section class="card users">
        <div class="metric-top">
            <span>Active Users</span>
            <span class="metric-change">+154</span>
        </div>
        <div class="big-number">1,538</div>
    </section>
    <section class="card design">
        <h2>DESIGN</h2>
    </section>
    <section class="card subscribers">
        <div class="metric-top">
            <span>Total Subscribers</span>
            <span class="metric-change alt">+7%</span>
        </div>
        <div class="big-number" style="color:#0d1020;">200K</div>
    </section>
    <section class="card learn">
        <h3>
            A place to learn UI Design &
            <br>
            Web Design.
        </h3>
    </section>
</div>
</body>
</html>
