<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parent Hover Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

.box{
    width:400px;
    height:400px;
    border:2px solid black;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-content:center;
    background-image:url("5A3378C5-E0DD-4A90-B969-65B974D07B04_1_105_c.jpeg");
    background-size:cover;
    background-position:center;
}

.card{
    width:198px;
    height:198px;
    display:flex;
    justify-content:center;
    align-items:center;
    background-color:rgb(0,152,253);
    transition:all .5s ease;
   
}
.c1{
    transform-origin:top left;
}
.c2{
    transform-origin:top right;
}
.c3{
    transform-origin:bottom left;
}
.c4{
    transform-origin:bottom right;
}


.box:hover .c1{
    transform:rotate(90deg);
}

.box:hover .c2{
    transform:rotate(-90deg);
}

.box:hover .c3{
    transform:rotate(-90deg);
}

.box:hover .c4{
    transform:rotate(90deg);
}
</style>
</head>

<body>

<div class="box">
    <div class="card c1"></div>
    <div class="card c2"></div>
    <div class="card c3"></div>
    <div class="card c4"></div>
</div>

</body>
</html>
