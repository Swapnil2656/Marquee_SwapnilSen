<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S letter using grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(7, 1fr);
            height: 600px;
            width: 600px;
            gap: 1px;
            background-color: #ffffff;
            border: 2px solid black;
            padding: 10px;
        }
        .box{
            background-color: rgb(7, 34, 240);
        }
        .a{
            grid-column: 1/6;
            grid-row: 1/2;
        }
        .b{
            grid-column: 1/2;
            grid-row: 1/5;
        }
        .c{
            grid-column: 1/6;
            grid-row: 4/5;
        }
        .d{
            grid-column: 5/6;
            grid-row: 4/8;
        }
        .e{
            grid-column: 1/6;
            grid-row: 7/8;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="box a"></div>
    <div class="box b"></div>
    <div class="box c"></div>
    <div class="box d"></div>
    <div class="box e"></div>
</body>
</html>
