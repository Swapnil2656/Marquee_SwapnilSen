<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid template layout</title>
    <style>
         .container{
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            height: 500px;
            width: 600px;
            gap: 1px;
            background-color: #ffffff;
            border: 2px solid black;
            padding: 10px;
        }
        .box{
            background-color: rgb(7, 34, 240);
            width:60px;
            height:60px;

        }
        .a{
            justify-self: end;
            align-self: end;
            
        }
        .b{
            justify-self: center;
            align-self: center;

        }
        .c{
            justify-self: start;
            align-self: end;
        }
        .d{
            justify-self: start;
            align-self: start;
        }
        .e{
            justify-self: center;
            align-self: end;
        }
        .f{
            justify-self: end;
            align-self: start;
        }
        .g{
            justify-self: end;
            align-self: center;
        }
        .h{
            justify-self: start;
            align-self: center;
        }
        .i{
            justify-self: start;
            align-self: center;
        }
            

    </style>
</head>
<body>
    <div class="container">
        <div class="box a"></div>
        <div class="box b"></div>
        <div class="box c"></div>
        <div class="box d"></div>
        <div class="box e"></div>
        <div class="box f"></div>
        <div class="box g"></div>
        <div class="box h"></div>
        <div class="box i"></div>
    </div>
</body>
</html>
