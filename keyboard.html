<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Keyboard</title>

<style>


.keyboard{

    display:grid;
    grid-template-columns:repeat(10,70px);
    gap:15px;
    padding:30px;
    background:#111;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,.5);
}

.key{

    width:70px;
    height:70px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#ececec;
    font-size:24px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
    transition:.3s;
    
}

.key:hover{

    background:#4CAF50;
    color:white;
    transform:
    translateY(-8px)
    scale(1.1)
    rotate(-3deg);
}

.key:active{

    transform:
    translateY(6px)
    scale(.95);


}

.space{

    grid-column:3/9;

    height:70px;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#ddd;

    border-radius:12px;

    font-size:22px;
    font-weight:bold;

    cursor:pointer;

    transition:.3s;

   
}
.space:hover{

    background:#2196F3;
    color:white;

    transform:
    translateY(-8px)
    scale(1.05);

}
.space:active{

    transform:
    translateY(6px)
    scale(.96);
    box-shadow:0 2px #555;
}
.backspace{
    grid-column: span 2;
}

.tab{
    grid-column: span 2;
}

.caps{
    grid-column: span 2;
}

.enter{
    grid-column: span 2;
}

.shift{
    grid-column: span 2;
}

.space{
    grid-column: span 5;
}

.zero{
    grid-column: span 2;
}

</style>

</head>
<body>

<div class="keyboard">
