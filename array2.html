//to push an object in employee whose

 //keep any age and country name 

 let TS = 0;

employees.forEach(employee => {
    TS += employee.salary;
});

    employeename: employees.map(employee => employee.name.charAt(0)).join(""),
    salary: TS / employees.length,
    department: employees.map(employee => employee.country.charAt(2)).join(""),
    age: 30,
    country: "USA"
};

employees.push(newEmployee);
