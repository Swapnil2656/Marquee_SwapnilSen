<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid Layout</title>
  <style>
    

   
    .container{
      width:900px;
      height:650px;
      border:2px solid #333;
      padding:12px;
      display:grid;
      gap:12px;

      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 2fr 2fr 1fr;
    }

    .box{
      background:#66bff0;
    }

    .left{
      grid-row:1 / span 2;
      grid-column:1;
    }

    .top1{
      grid-row:1;
      grid-column:2;
    }

    .top2{
      grid-row:1;
      grid-column:3;
    }

    .mid1{
      grid-row:2;
      grid-column:2;
    }

    .mid2{
      grid-row:2;
      grid-column:3;
    }

    .bottom{
      grid-row:3;
      grid-column:1 / -1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box left"></div>
    <div class="box top1"></div>
    <div class="box top2"></div>
    <div class="box mid1"></div>
    <div class="box mid2"></div>
    <div class="box bottom"></div>
  </div>

</body>
</html>
