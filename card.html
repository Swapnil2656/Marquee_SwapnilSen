<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9e9e9;
}

.container{
    width:300px;
    height:400px;
    border:2px ;
    background-color:white;
    border-radius:30px;
    overflow:hidden;
}

.blue{
    width:100%;
    height:30%;
    background-color:rgb(56, 80, 255);
    display:flex;
    justify-content:center;
    align-items:flex-end;
}

.dp{
    width:150px;
    height:150px;
    border-radius:50%;
    background-image:url('5A3378C5-E0DD-4A90-B969-65B974D07B04_1_105_c.jpeg');
    background-size:cover;
    background-color:white;
    border:5px solid rgb(56, 80, 255);
    margin-bottom:-40px; 
    
}
#dp{
    border:5px solid rgb(56, 80, 255);
}

.innercontainer{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding-top:50px;
    padding-bottom:10px;
}
.social-icons{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:5px 0 20px;
}

.icon{
    width:50px;
    height:50px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.icon img{
    width:45px;
    height:45px;
    object-fit:contain;
}
.button-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px; 
}

button{
    padding:10px 25px;
    border:none;
    background:rgb(29, 55, 255);
    color:white;
    border-radius:20px;
    cursor:pointer;
}
.likeShare {
        display: flex;
        justify-content: space-evenly;
        padding: 15px;
      }
.like, .comment {
        border-right: 1px solid #ddd;
        padding-right: 10px;
      }    
</style>
</head>

<body>

<div class="container">

    <div class="blue">
        <div class="dp"></div>
    </div>

    <div class="innercontainer">
        <h2>CodingLab</h2>
        <p>Youtuber & Blogger</p>
       
    </div>
   <div class="social-icons">
    <div class="icon">
        <img src="facebook-png-icon-follow-us-facebook-1.png" alt="">
    </div>
    <div class="icon">
        <img src="twitter-logo-twitter-icon-transparent-free-free-png.webp" alt="">
    </div>
    <div class="icon">
        <img src="instagram-logo-instagram-icon-transparent-free-png.webp" alt="">
    </div>
    <div class="icon">
        <img src="vector-circle-youtube-logo-collection-with-flat-design_534308-21669.avif" alt="">
    </div>

</div>
   <div class="button-container">
    <button>Subscribe</button>
    <button>Message</button>
</div>
<div class="likeShare">
        <div class="like">♡ 60.4K</div>
        <div class="comment">💬 1.2K</div>
        <div class="share">↗ 2.5K</div>
      </div>
</div>

</body>
</html>
