<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hover Effect on Boxes</title>

<style>
   

    .box{
        width:700px;
        height:700px;
        border:1px solid black;
        padding:20px;
        display:flex;
        flex-wrap:wrap;
        gap:20px;
    }
    .parent{
        width:200px;
        height:200px;
        border:1px solid black;
        border-radius:50px;
        
    }

    .card{
        width:200px;
        height:200px;
        border:1px solid black;
        border-radius:15px;
        transition:0.3s;
    }


    .b1{
        background:lightblue;
    }

    .b1:hover{
        transform:rotate(90deg);
        background:lightcoral;
    }


    .b2{
        background:lightgreen;
    }

    .b2:active{
        background:lightcoral;
        transform:translateX(50px);
    }

  
    .b3{
        background:rgb(255,255,98);
    }

    .b3:active{
        background:lightcoral;
        transform:scale(1.2);
    }

    .b4{
        background:rgb(255,255,98);
    }

    .b4:active{
        background:lightcoral;
        transform:scale(1.2);
    }

  
    .b5{
        background:rgb(255,255,98);
    }

    .b5:active{
        background:lightcoral;
        transform:scale(1.2);
    }

  
    .b6{
        background:rgb(255,255,98);
    }

    .parent.b6{
        background:lightcoral;
        transform:scale(1.2);
    }
</style>

</head>
<body>

<div class="box">
    <div class="card b1"></div>
    <div class="card b2"></div>
    <div class="card b3"></div>
    <div class="card b4"></div>
    <div class="card b5"></div>
    <div class="card b6"></div>
</div>

</body>
</html>
