<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box move with arrow keys</title>
    <style>


       #box{
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    
    </style>
</head>
<body>

<div id="box"></div>


    <script>

let box = document.querySelector('#box'); 
document.addEventListener('keydown', function(event){
    switch(event.key){
        case 'ArrowUp':
            box.style.top = (box.offsetTop - 100) + 'px';
            break;
        case 'ArrowDown':
            box.style.top = (box.offsetTop + 100) + 'px';
            break;
        case 'ArrowLeft':
            box.style.left = (box.offsetLeft - 100) + 'px';
            break;
        case 'ArrowRight':
            box.style.left = (box.offsetLeft + 100) + 'px';
            break;
    }
});


    </script>
</body>
</html>
