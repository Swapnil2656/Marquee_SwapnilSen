<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Calculator</title>
<link rel="icon" href="data:,">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6dd5ed,#2193b0);
}

.container{
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#333;
}

#mydiv{
    width:350px;
    height:180px;
    border-radius:15px;
    border:3px solid #333;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:3rem;
    font-weight:bold;
    background:#ff4d4d;
    color:white;
    margin-bottom:25px;
    transition:0.3s;
}

.buttons{
    display:flex;
    gap:15px;
    justify-content:center;
}

button{
    width:70px;
    height:70px;
    border:none;
    border-radius:50%;
    font-size:1.8rem;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

button:active{
    transform:scale(0.95);
}

#addbtn{
    background:#28a745;
}

#subbtn{
    background:#dc3545;
}

#mulbtn{
    background:#007bff;
}

#divbtn{
    background:#ffc107;
    color:black;
}
</style>

</head>
<body>

<div class="container">

    <h2>Simple Calculator</h2>

    <div id="mydiv">
        5 &nbsp; and &nbsp; 10
    </div>

    <div class="buttons">
        <button id="addbtn">+</button>
        <button id="subbtn">−</button>
        <button id="mulbtn">×</button>
        <button id="divbtn">÷</button>
    </div>

</div>

<script>

let div1 = document.querySelector("#mydiv");
let addbtn = document.querySelector("#addbtn");
let subbtn = document.querySelector("#subbtn");
let mulbtn = document.querySelector("#mulbtn");
let divbtn = document.querySelector("#divbtn");

let num1 = 5;
let num2 = 10;

addbtn.addEventListener("click", function () {
    div1.textContent = num1 + num2;
    div1.style.backgroundColor = "#28a745";
});

subbtn.addEventListener("click", function () {
    div1.textContent = num1 - num2;
    div1.style.backgroundColor = "#dc3545";
});

mulbtn.addEventListener("click", function () {
    div1.textContent = num1 * num2;
    div1.style.backgroundColor = "#007bff";
});

divbtn.addEventListener("click", function () {
    div1.textContent = num1 / num2;
    div1.style.backgroundColor = "#ffc107";
   
});

</script>

</body>
</html>
