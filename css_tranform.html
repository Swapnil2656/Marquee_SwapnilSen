<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Grid Animation</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#111;
    font-family:Arial;
}

.container{
    display:grid;
    grid-template-columns:repeat(3,180px);
    grid-template-rows:repeat(3,180px);
    gap:25px;
}

.card{
    background:white;
    border-radius:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:55px;
    transition:0.6s;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}


.c1:hover{
    transform:rotate(360deg);
    background:skyblue;
}


.c2:hover{
    transform:scale(1.25);
    background:orange;
}


.c3:hover{
    transform:translateY(-30px);
    background:limegreen;
}


.c4:hover{
    transform:translateX(30px);
    background:violet;
}


.c5:hover{
    transform:rotate(180deg) scale(1.2);
    background:gold;
}


.c6:hover{
    transform:scale(0.8) rotate(-25deg);
    background:tomato;
}


.c7:hover{
    transform:translate(-20px,-20px);
    background:cyan;
}


.c8:hover{
    transform:translate(20px,20px) rotate(25deg);
    background:deeppink;
}


.c9:hover{
    transform:rotateX(180deg);
    background:crimson;
    color:white;
}



.card:active{
    transform:scale(0.9);
}

</style>

</head>

<body>

<div class="container">

<div class="card c1">⚙️</div>
<div class="card c2">🚀</div>
<div class="card c3">🎯</div>
<div class="card c4">💎</div>
<div class="card c5">⭐</div>
<div class="card c6">🔥</div>
<div class="card c7">🎵</div>
<div class="card c8">❤️</div>
<div class="card c9">🎮</div>

</div>

</body>
</html>
